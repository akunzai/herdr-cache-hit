name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      sha:
        description: Exact commit to test before release publication
        required: true
        type: string

jobs:
  test:
    runs-on: ${{ matrix.os }}
    env:
      LC_ALL: C.UTF-8
      LANG: C.UTF-8
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha || github.sha }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.24'

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y jq bc shellcheck

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install jq bc shellcheck

      - name: Check shell script syntax
        run: |
          bash -n watch.sh
          bash -n bin/herdr-cache-view
          bash -n bin/herdr-cache-warm
          for f in lib/*.sh scripts/*.sh; do
            bash -n "$f"
          done

      - name: Run shellcheck
        run: |
          shellcheck -x watch.sh lib/*.sh bin/herdr-cache-view bin/herdr-cache-warm scripts/*.sh

      - name: Run Go tests & build
        run: |
          go test -v ./cmd/agy-usage
          go build ./cmd/agy-usage

      - name: Run test suite
        run: |
          bash tests/test_watch.sh

      - name: Guard against eval in documentation
        run: |
          if grep -q 'eval' docs/AGY_INTEGRATION.md; then
            echo "::error::docs/AGY_INTEGRATION.md contains 'eval' — this is a known injection vector" >&2
            exit 1
          fi

  bash32-test:
    # macOS still ships Bash 3.2 as /bin/bash, but the macOS runner puts a
    # newer Homebrew Bash first on PATH. Compile Bash 3.2.57 on Linux, cache
    # it, and run the suite with it first on PATH, so the scripts' own
    # `bash` calls use it too.
    runs-on: ubuntu-latest
    env:
      LC_ALL: C.UTF-8
      LANG: C.UTF-8
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha || github.sha }}

      - name: Cache Bash 3.2
        id: cache-bash32
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/bash32
          key: bash-3.2.57-${{ runner.os }}-${{ runner.arch }}

      - name: Compile Bash 3.2
        if: steps.cache-bash32.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          build_dir=$(mktemp -d)
          curl -fsSL https://ftp.gnu.org/gnu/bash/bash-3.2.57.tar.gz | tar -xz -C "$build_dir"
          cd "$build_dir/bash-3.2.57"
          # Bash 3.2 predates C99 defaults and modern GCC errors.
          cflags="-std=gnu89 -Wno-error=implicit-function-declaration -Wno-error=incompatible-pointer-types -Wno-error=implicit-int"
          CC="gcc -std=gnu89" CC_FOR_BUILD="gcc -std=gnu89" CFLAGS="$cflags" CFLAGS_FOR_BUILD="$cflags" \
            ./configure --prefix="$HOME/.local/bash32" --without-bash-malloc
          make -j"$(nproc)"
          make install

      - name: Put Bash 3.2 first on PATH
        run: |
          echo "$HOME/.local/bash32/bin" >>"$GITHUB_PATH"

      - name: Run test suite under Bash 3.2
        run: |
          [[ "$(bash --version | head -n 1)" == *"version 3.2"* ]]
          bash tests/test_watch.sh

  python36-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha || github.sha }}

      - name: Check Python 3.6 compatibility
        run: |
          docker run --rm -v "$PWD:/work:ro" -w /work python:3.6.15-slim-buster \
            python -B -m unittest discover -s tests -p 'test_*_session.py'
          docker run --rm -v "$PWD:/work:ro" -w /work python:3.6.15-slim-buster \
            python -c 'import ast, pathlib; [ast.parse(p.read_text(encoding="utf-8"), filename=str(p)) for p in pathlib.Path("lib").glob("*.py")]'

  windows-test:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha || github.sha }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.24'

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Install jq
        shell: pwsh
        run: choco install jq -y --no-progress

      - name: Run Windows Git Bash checks
        shell: bash
        run: |
          bash -n watch.sh
          for f in lib/*.sh scripts/*.sh tests/*.sh bin/herdr-cache-*; do
            bash -n "$f"
          done
          go test ./cmd/agy-usage/...
          bash tests/test_watch.sh
