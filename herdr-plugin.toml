id = "cache-hit"
name = "Cache Hit"
version = "0.1.8"
min_herdr_version = "0.9.0"
description = "Report prompt-cache usage for Herdr Codex, AGY, Claude, and OpenCode panes"
platforms = ["macos", "linux"]

[[build]]
platforms = ["macos", "linux"]
command = ["bash", "scripts/download-helpers.sh"]

[[startup]]
command = ["bash", "watch.sh"]

[[startup]]
command = ["bash", "bin/herdr-cache-view", "restore"]


[[events]]
on = "pane.agent_detected"
command = ["bash", "watch.sh"]

[[events]]
on = "pane.agent_status_changed"
command = ["bash", "watch.sh"]

[[events]]
on = "pane.focused"
command = ["bash", "watch.sh"]

[[events]]
on = "pane.closed"
command = ["bash", "watch.sh"]

[[events]]
on = "pane.exited"
command = ["bash", "watch.sh"]
